spring.application.name=demo
server.servlet.context-path=/

# Database (ค่าเริ่มต้นตรงกับ docker-compose.yml ถ้ารันใน Docker จะถูกทับด้วย SPRING_DATASOURCE_* )
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# ตารางสร้างจาก docs/database/schema.sql และ schema_orders.sql ไม่ให้ JPA สร้างหรือแก้ตาราง
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# อัปโหลดรูป (สลิป Task20, หลักฐานรับสินค้า Task24) ไม่เกิน 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
