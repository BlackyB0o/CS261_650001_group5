spring.application.name=demo
server.servlet.context-path=/

# Database (ค่าเริ่มต้นตรงกับ docker-compose.yml ถ้ารันใน Docker จะถูกทับด้วย SPRING_DATASOURCE_* )
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# ให้ JPA สร้าง/เพิ่มตารางตาม Entity อัตโนมัติ (ชื่อ column ตรงกับ docs/database/schema.sql)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# อัปโหลดรูป (สลิป Task20, หลักฐานรับสินค้า Task24) ไม่เกิน 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT (Task04) ตอนส่งงานจริงให้ตั้ง APP_JWT_SECRET เป็นค่าลับยาวอย่างน้อย 32 ตัวอักษร
app.jwt.secret=${APP_JWT_SECRET:carryhub-dev-secret-change-me-at-least-32-bytes}
app.jwt.expiration-minutes=1440

# โฟลเดอร์เก็บรูปที่อัปโหลด เปิดดูได้ที่ /uploads/...
app.upload-dir=${APP_UPLOAD_DIR:uploads}
