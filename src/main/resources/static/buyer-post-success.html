<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้างโพสต์สำเร็จ | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/create-success.css">
</head>

<body>

  <header class="navbar">
    <a href="index.html" class="logo">CarryHub</a>

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="เปิดเมนู"
        aria-expanded="false"
        aria-controls="navMenu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="navMenu">
        <a href="index.html">หน้าแรก</a>
        <a href="rounds.html">รอบรับหิ้ว</a>
        <a href="buyer-posts.html">หาคนรับหิ้ว</a>
        <a href="orders.html" class="nav-active">รายการของฉัน</a>
        <a href="profile.html">โปรไฟล์</a>
        <a href="login.html" class="btn btn-outline">เข้าสู่ระบบ</a>
        <a href="register.html" class="btn btn-primary">ลงทะเบียน</a>
    </nav>
</header>

    <main class="container">
        <section class="success-card">
            <div class="success-icon">✓</div>
            <h1>ดูโพสต์หาคนรับหิ้ว</h1>
            <p>โพสต์จะถือว่าสร้างสำเร็จเมื่อ API ตอบกลับว่าบันทึกแล้ว</p>

            <a href="orders.html#posts-panel" class="btn btn-primary">
                ดูโพสต์ของฉัน
            </a>

            <a href="buyer-posts.html" class="btn btn-outline">
                กลับหน้าโพสต์
            </a>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>

    <script src="/js/guest-access.js"></script>
    <script>
    const menuToggle = document.getElementById("menuToggle");
    const navMenu = document.getElementById("navMenu");

    menuToggle.addEventListener("click", function () {
        const isOpen = navMenu.classList.toggle("open");

        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.setAttribute(
            "aria-label",
            isOpen ? "ปิดเมนู" : "เปิดเมนู"
        );
    });

    navMenu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        });
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 850) {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        }
    });
</script>
</body>

</html>
