<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โพสต์ของฉัน | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/buyer-post-detail.css">
</head>

<body>
   <header class="navbar">
    <a href="index.html" class="logo">CarryHub</a>

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="เปิดเมนู"
        aria-expanded="false"
        aria-controls="navMenu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="navMenu">
        <a href="index.html">หน้าแรก</a>
        <a href="rounds.html">รอบรับหิ้ว</a>
        <a href="buyer-posts.html">หาคนรับหิ้ว</a>
        <a href="orders.html" class="nav-active">รายการของฉัน</a>
        <a href="profile.html">โปรไฟล์</a>
        <a href="login.html" class="btn btn-outline">เข้าสู่ระบบ</a>
        <a href="register.html" class="btn btn-primary">ลงทะเบียน</a>
    </nav>
</header>

    <main class="container post-detail-container">
        <a href="orders.html#posts-panel" class="back-link">← กลับไปโพสต์ของฉัน</a>
        <p id="my-post-message" class="form-message" role="status" aria-live="polite" hidden></p>

        <section id="my-post-content" class="post-detail-card" hidden>
            <div class="post-detail-header">
                <span id="my-post-status" class="post-status"></span>
                <span id="my-post-id" class="post-id"></span>
            </div>
            <h1 id="my-post-title"></h1>
            <p id="my-post-product" class="post-description"></p>
            <div class="post-divider"></div>
            <h2>รายละเอียดโพสต์</h2>
            <div class="post-info">
                <div class="info-item"><span class="info-label">ร้านค้า</span><strong id="my-post-shop"></strong></div>
                <div class="info-item"><span class="info-label">จำนวน</span><strong id="my-post-quantity"></strong></div>
                <div class="info-item"><span class="info-label">วันที่ต้องการ</span><strong id="my-post-date"></strong></div>
                <div class="info-item"><span class="info-label">สถานที่รับสินค้า</span><strong id="my-post-location"></strong></div>
                <div class="info-item"><span class="info-label">ค่าหิ้ว</span><strong id="my-post-fee"></strong></div>
                <div class="info-item"><span class="info-label">งบประมาณ</span><strong id="my-post-budget"></strong></div>
                <div class="info-item"><span class="info-label">ผู้รับงาน</span><strong id="my-post-accepted-by"></strong></div>
                <div class="info-item"><span class="info-label">วันที่รับงาน</span><strong id="my-post-accepted-at"></strong></div>
            </div>
            <div class="post-note">
                <h3>รายละเอียดเพิ่มเติม</h3>
                <p id="my-post-additional"></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer-text">© 2026 CarryHub</p>
    </footer>

    <script src="/js/my-post-detail.js"></script>
    <script src="/js/guest-access.js"></script>
    <script>
    const menuToggle = document.getElementById("menuToggle");
    const navMenu = document.getElementById("navMenu");

    menuToggle.addEventListener("click", function () {
        const isOpen = navMenu.classList.toggle("open");

        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.setAttribute(
            "aria-label",
            isOpen ? "ปิดเมนู" : "เปิดเมนู"
        );
    });

    navMenu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        });
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 850) {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        }
    });
</script>
</body>

</html>
