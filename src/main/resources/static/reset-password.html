<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">CarryHub</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="login.html">เข้าสู่ระบบ</a>
        </nav>
    </header>

    <main class="container">
        <section class="auth-card">
            <h1>ตั้งรหัสผ่านใหม่</h1>
            <p>สร้างรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>

            <p id="reset-message" class="form-message" role="status" aria-live="polite" hidden></p>

            <form id="reset-password-form" method="post" onsubmit="return false;">
                <div class="form-group">
                    <label for="password">รหัสผ่านใหม่</label>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่านใหม่" minlength="8"
                        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                        title="รหัสผ่านต้องมีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก และตัวเลข อย่างน้อย 8 ตัวอักษร"
                        autocomplete="new-password" required>
                    <small>อย่างน้อย 8 ตัวอักษร ใช้ตัวพิมพ์ใหญ่ พิมพ์เล็ก และตัวเลข</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
                    <input type="password" id="confirm-password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
                        minlength="8" autocomplete="new-password" required>
                </div>

                <button id="reset-password-button" type="submit" class="btn btn-primary btn-full">
                    บันทึกรหัสผ่านใหม่
                </button>
            </form>

            <p id="login-link" class="text-center" hidden>
                <a href="login.html">กลับไปเข้าสู่ระบบ</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>

    <script>
        const resetPasswordForm = document.getElementById("reset-password-form");
        const newPasswordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirm-password");
        const resetPasswordButton = document.getElementById("reset-password-button");
        const resetMessage = document.getElementById("reset-message");
        const loginLink = document.getElementById("login-link");

        function showResetMessage(message, success) {
            resetMessage.textContent = message;
            resetMessage.className = "form-message " + (success ? "success-message" : "error-message");
            resetMessage.hidden = false;
        }

        function validatePasswordConfirmation() {
            confirmPasswordInput.setCustomValidity(
                confirmPasswordInput.value === newPasswordInput.value
                    ? ""
                    : "รหัสผ่านไม่ตรงกัน"
            );
        }

        newPasswordInput.addEventListener("input", validatePasswordConfirmation);
        confirmPasswordInput.addEventListener("input", validatePasswordConfirmation);

        let verificationId;
        let otp;
        try {
            verificationId = Number(
                sessionStorage.getItem("carryhub.verificationId")
                    || localStorage.getItem("carryhub.verificationId")
            );
            otp = sessionStorage.getItem("carryhub.resetOtp");
        } catch (error) {
            showResetMessage("ไม่สามารถเรียกข้อมูล OTP ได้ กรุณาขอรหัสรีเซ็ตรหัสผ่านใหม่", false);
        }

        if (!Number.isInteger(verificationId) || verificationId <= 0 || !otp) {
            resetPasswordForm.hidden = true;
            showResetMessage("ไม่พบข้อมูล OTP สำหรับรีเซ็ตรหัสผ่าน กรุณาเริ่มขอรหัสใหม่", false);
        }

        resetPasswordForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            validatePasswordConfirmation();
            resetPasswordButton.disabled = true;
            resetPasswordButton.textContent = "กำลังบันทึก...";
            resetMessage.hidden = true;

            let response;
            try {
                response = await fetch("/api/v1/auth/password/reset", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        verificationId: verificationId,
                        otp: otp,
                        newPassword: newPasswordInput.value
                    })
                });
            } catch (error) {
                showResetMessage("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองอีกครั้ง", false);
                resetPasswordButton.disabled = false;
                resetPasswordButton.textContent = "บันทึกรหัสผ่านใหม่";
                return;
            }

            let result;
            try {
                result = await response.json();
            } catch (error) {
                showResetMessage("เซิร์ฟเวอร์ตอบกลับในรูปแบบที่ไม่ถูกต้อง กรุณาลองอีกครั้ง", false);
                resetPasswordButton.disabled = false;
                resetPasswordButton.textContent = "บันทึกรหัสผ่านใหม่";
                return;
            }

            if (!response.ok || !result || result.status !== "SUCCESS") {
                const fieldLabels = {
                    verificationId: "OTP",
                    otp: "OTP",
                    newPassword: "รหัสผ่านใหม่"
                };
                const fieldErrors = Array.isArray(result && result.errors)
                    ? result.errors
                        .filter(function (item) {
                            return item && typeof item.field === "string" && typeof item.message === "string";
                        })
                        .map(function (item) {
                            return (fieldLabels[item.field] || item.field) + ": " + item.message;
                        })
                    : [];
                const message = result && typeof result.message === "string"
                    ? result.message
                    : "ตั้งรหัสผ่านไม่สำเร็จ (HTTP " + response.status + ")";
                showResetMessage([message].concat(fieldErrors).join("\n"), false);
                resetPasswordButton.disabled = false;
                resetPasswordButton.textContent = "บันทึกรหัสผ่านใหม่";
                return;
            }

            showResetMessage("เปลี่ยนรหัสผ่านสำเร็จแล้ว กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่", true);
            resetPasswordForm.hidden = true;
            loginLink.hidden = false;
            try {
                sessionStorage.removeItem("carryhub.verificationId");
                sessionStorage.removeItem("carryhub.otpPurpose");
                sessionStorage.removeItem("carryhub.maskedPhoneNumber");
                localStorage.removeItem("carryhub.verificationId");
                localStorage.removeItem("carryhub.otpPurpose");
                localStorage.removeItem("carryhub.maskedPhoneNumber");
                sessionStorage.removeItem("carryhub.resetOtp");
            } catch (error) {
                console.warn("Could not clear the completed password reset state.", error);
            }
        });
    </script>
</body>

</html>
