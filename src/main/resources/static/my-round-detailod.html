<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการรอบรับหิ้ว | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/round-detail.css">
</head>

<body>
   <header class="navbar">
    <a href="index.html" class="logo">CarryHub</a>

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="เปิดเมนู"
        aria-expanded="false"
        aria-controls="navMenu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="navMenu">
        <a href="index.html">หน้าแรก</a>
        <a href="rounds.html">รอบรับหิ้ว</a>
        <a href="buyer-posts.html">หาคนรับหิ้ว</a>
        <a href="orders.html" class="nav-active">รายการของฉัน</a>
        <a href="profile.html">โปรไฟล์</a>
        <a href="login.html" class="btn btn-outline">เข้าสู่ระบบ</a>
        <a href="register.html" class="btn btn-primary">ลงทะเบียน</a>
    </nav>
</header>

    <main class="container round-detail-container">
        <a href="orders.html#rounds-panel" class="back-link">← กลับไปรอบรับหิ้วของฉัน</a>
        <p id="my-round-message" class="form-message" role="status" aria-live="polite" hidden></p>

        <section id="my-round-content" class="round-detail-card" hidden>
            <div class="round-detail-header">
                <span id="my-round-status" class="round-status"></span>
                <span id="my-round-id" class="round-id"></span>
            </div>
            <h1 id="my-round-store"></h1>
            <p class="round-description">รายละเอียดรอบรับหิ้วของคุณ</p>
            <div class="round-divider"></div>
            <h2>รายละเอียดรอบรับหิ้ว</h2>
            <div class="round-info">
                <div class="round-info-item">
                    <span class="round-info-label">ผู้รับหิ้ว</span>
                    <strong id="my-round-runner"></strong>
                </div>
                <div class="round-info-item">
                    <span class="round-info-label">วันและเวลารับสินค้า</span>
                    <strong id="my-round-scheduled"></strong>
                </div>
                <div class="round-info-item">
                    <span class="round-info-label">ค่าบริการ</span>
                    <strong id="my-round-fee"></strong>
                </div>
                <div class="round-info-item">
                    <span class="round-info-label">สถานที่รับสินค้า</span>
                    <strong id="my-round-location"></strong>
                </div>
            </div>

            <form id="round-status-form" class="form-section" hidden>
                <label for="round-status-select">อัปเดตสถานะรอบ</label>
                <select id="round-status-select" required></select>
                <button id="round-status-button" type="submit" class="btn btn-primary">บันทึกสถานะ</button>
            </form>

            <div class="post-actions">
                <a href="orders.html#rounds-panel" class="btn btn-outline">กลับไปรอบรับหิ้วของฉัน</a>
            </div>
        </section>

        <section id="round-orders-section" class="round-detail-card" hidden>
            <h2>รายการฝากซื้อในรอบนี้</h2>
            <p id="round-orders-message" class="form-message" role="status" aria-live="polite" hidden></p>
            <div id="round-orders-list" class="orders-list" aria-live="polite"></div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>

    <script src="/js/my-round-detail.js"></script>
    <script src="/js/guest-access.js"></script>
    <script>
    const menuToggle = document.getElementById("menuToggle");
    const navMenu = document.getElementById("navMenu");

    menuToggle.addEventListener("click", function () {
        const isOpen = navMenu.classList.toggle("open");

        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.setAttribute(
            "aria-label",
            isOpen ? "ปิดเมนู" : "เปิดเมนู"
        );
    });

    navMenu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        });
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 850) {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        }
    });
</script>
</body>

</html>
