<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="navbar">
    <a href="index.html" class="logo">CarryHub</a>

    <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-label="เปิดเมนู"
        aria-expanded="false"
        aria-controls="navMenu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="navMenu">
        <a href="index.html">หน้าแรก</a>
        <a href="rounds.html">รอบรับหิ้ว</a>
        <a href="buyer-posts.html">หาคนรับหิ้ว</a>
        <a href="orders.html" class="nav-active">รายการของฉัน</a>
        <a href="profile.html">โปรไฟล์</a>
        <a href="login.html" class="btn btn-outline">เข้าสู่ระบบ</a>
        <a href="register.html" class="btn btn-primary">ลงทะเบียน</a>
    </nav>
</header>

    <main class="container">
        <section class="auth-card">
            <h1>ลืมรหัสผ่าน?</h1>
            <p>กรอกเบอร์โทรศัพท์ที่ใช้สมัครสมาชิกเพื่อดำเนินการรีเซ็ตรหัสผ่าน</p>

            <form id="forgot-password-form" method="post" onsubmit="return false;">
                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" placeholder="กรอกเบอร์โทรศัพท์ 10 หลัก" maxlength="10"
                        pattern="[0-9]{10}" inputmode="numeric" autocomplete="tel"
                        title="กรุณากรอกเบอร์โทรศัพท์ 10 หลัก" required>
                </div>

                <p id="forgot-password-message" class="form-message" role="status" aria-live="polite" hidden></p>

                <button id="forgot-password-button" type="submit" class="btn btn-primary btn-full">
                    ดำเนินการต่อ
                </button>
            </form>

            <p class="text-center">
                <a href="login.html">กลับไปเข้าสู่ระบบ</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>

    <script>
        const forgotPasswordForm = document.getElementById("forgot-password-form");
        const forgotPasswordButton = document.getElementById("forgot-password-button");
        const forgotPasswordMessage = document.getElementById("forgot-password-message");

        function showForgotPasswordMessage(message) {
            forgotPasswordMessage.textContent = message;
            forgotPasswordMessage.className = "form-message error-message";
            forgotPasswordMessage.hidden = false;
        }

        forgotPasswordForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            forgotPasswordButton.disabled = true;
            forgotPasswordButton.textContent = "กำลังขอรหัส OTP...";
            forgotPasswordMessage.hidden = true;

            let response;
            try {
                response = await fetch("/api/v1/auth/password/forgot", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        phoneNumber: document.getElementById("phone").value.trim()
                    })
                });
            } catch (error) {
                showForgotPasswordMessage("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองอีกครั้ง");
                forgotPasswordButton.disabled = false;
                forgotPasswordButton.textContent = "ดำเนินการต่อ";
                return;
            }

            let result;
            try {
                result = await response.json();
            } catch (error) {
                showForgotPasswordMessage("เซิร์ฟเวอร์ตอบกลับในรูปแบบที่ไม่ถูกต้อง กรุณาลองอีกครั้ง");
                forgotPasswordButton.disabled = false;
                forgotPasswordButton.textContent = "ดำเนินการต่อ";
                return;
            }

            const verificationId = result && result.data && result.data.verificationId;
            if (!response.ok || !result || result.status !== "SUCCESS"
                || !Number.isInteger(verificationId) || verificationId <= 0) {
                showForgotPasswordMessage(
                    result && typeof result.message === "string"
                        ? result.message
                        : "ไม่สามารถขอรหัส OTP ได้ (HTTP " + response.status + ")"
                );
                forgotPasswordButton.disabled = false;
                forgotPasswordButton.textContent = "ดำเนินการต่อ";
                return;
            }

            try {
                sessionStorage.setItem("carryhub.verificationId", String(verificationId));
                sessionStorage.setItem("carryhub.otpPurpose", "RESET_PASSWORD");
                sessionStorage.setItem(
                    "carryhub.maskedPhoneNumber",
                    result.data.maskedPhoneNumber || ""
                );
            } catch (error) {
                console.warn("Could not store OTP context in this tab; passing it to the OTP page directly.", error);
            }

            try {
                localStorage.setItem("carryhub.verificationId", String(verificationId));
                localStorage.setItem("carryhub.otpPurpose", "RESET_PASSWORD");
                localStorage.setItem(
                    "carryhub.maskedPhoneNumber",
                    result.data.maskedPhoneNumber || ""
                );
            } catch (error) {
                console.warn("Could not persist OTP context across tabs; continuing with this tab's session.", error);
            }

            const otpContext = new URLSearchParams({
                verificationId: String(verificationId),
                purpose: "RESET_PASSWORD"
            });
            window.location.assign("/verify-otp.html?" + otpContext.toString());
        });
    </script>
    <script>
    const menuToggle = document.getElementById("menuToggle");
    const navMenu = document.getElementById("navMenu");

    menuToggle.addEventListener("click", function () {
        const isOpen = navMenu.classList.toggle("open");

        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.setAttribute(
            "aria-label",
            isOpen ? "ปิดเมนู" : "เปิดเมนู"
        );
    });

    navMenu.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        });
    });

    window.addEventListener("resize", function () {
        if (window.innerWidth > 850) {
            navMenu.classList.remove("open");
            menuToggle.setAttribute("aria-expanded", "false");
            menuToggle.setAttribute("aria-label", "เปิดเมนู");
        }
    });
</script>
</body>

</html>
