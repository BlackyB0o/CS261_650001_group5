<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">CarryHub</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="login.html">เข้าสู่ระบบ</a>
        </nav>
    </header>

    <main class="container">
        <section class="auth-card">
            <h1>ลืมรหัสผ่าน?</h1>
            <p>กรอกเบอร์โทรศัพท์ที่ใช้สมัครสมาชิกเพื่อดำเนินการรีเซ็ตรหัสผ่าน</p>

            <form action="reset-password.html">
                <div class="form-group">
                    <label for="email">เบอร์โทรศัพท์</label>
                    <input type="phone" id="phone" placeholder="กรอกเบอร์โทรศัพท์ของคุณ" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    ดำเนินการต่อ
                </button>
            </form>

            <p class="text-center">
                <a href="login.html">กลับไปเข้าสู่ระบบ</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>
</body>
</html>
