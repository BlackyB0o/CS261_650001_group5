<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยืนยันเบอร์โทรศัพท์ | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/verify.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">CarryHub</a>
        <nav>
            <a href="index.html">หน้าหลัก</a>
            <a href="login.html">เข้าสู่ระบบ</a>
        </nav>
    </header>

    <main class="verify-container">
        <div class="verify-card">

            <div class="verify-step">ขั้นตอนที่ 1 จาก 2</div>

            <h1>ยืนยันเบอร์โทรศัพท์</h1>
            <p>กรอกเบอร์โทรศัพท์เพื่อรับรหัส OTP</p>

            <form action="verify-otp.html" method="post">
                <label for="phone">เบอร์โทรศัพท์</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="กรอกเบอร์โทรศัพท์ 10 หลัก"
                    maxlength="10"
                    pattern="[0]{1}[0-9]{9}"
                    inputmode="numeric"
                    title="กรุณากรอกเบอร์โทรศัพท์ 10 หลัก โดยเริ่มต้นด้วยเลข 0"
                    required
                >

                <button type="submit" class="btn-full">
                    ส่งรหัส OTP
                </button>
            </form>

            <a href="register.html" class="back-link">ย้อนกลับ</a>

        </div>
    </main>

</body>
</html>
