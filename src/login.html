<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">CarryHub</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="login.html">เข้าสู่ระบบ</a>
            <a href="register.html" class="btn btn-primary">ลงทะเบียน</a>
        </nav>
    </header>

    <main class="container">
        <section class="auth-card">
            <h1>ยินดีต้อนรับกลับมา</h1>
            <p>เข้าสู่ระบบเพื่อใช้งาน CarryHub</p>

            <form action="index.html">
                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" placeholder="กรอกอีเมลของคุณ" required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" placeholder="กรอกรหัสผ่าน" 
                    minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                        title="รหัสผ่านต้องมีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก และตัวเลข อย่างน้อย 8 ตัวอักษร"
                        autocomplete="new-password" required>
                </div>

                <p><a href="forgot-password.html">ลืมรหัสผ่าน?</a></p>

                <button type="submit" class="btn btn-primary btn-full">
                    เข้าสู่ระบบ
                </button>
            </form>

            <p class="text-center">
                ยังไม่มีบัญชี?
                <a href="register.html">สมัครสมาชิก</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>
</body>
</html>
