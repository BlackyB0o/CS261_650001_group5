<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo">CarryHub</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="login.html">เข้าสู่ระบบ</a>
        </nav>
    </header>

    <main class="container">
        <section class="auth-card">
            <h1>สร้างบัญชี CarryHub</h1>
            <p>ลงทะเบียนเพื่อเริ่มใช้งาน</p>

            <form action="verify.html">
                <div class="form-group">
                    <label for="fullname">ชื่อ-นามสกุล</label>
                    <input type="text" id="fullname" placeholder="กรอกชื่อ-นามสกุล" required>
                </div>

                <div class="form-group">
                    <label for="email">อีเมล</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">เบอร์โทรศัพท์</label>
                    <input 
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="กรอกเบอร์โทรศัพท์ 10 หลัก"
                    maxlength="10"
                    pattern="[0]{1}[0-9]{9}"
                    inputmode="numeric"
                    title="กรุณากรอกเบอร์โทรศัพท์ 10 หลัก โดยเริ่มต้นด้วยเลข 0"
                    required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" name="password" placeholder="อย่างน้อย 8 ตัวอักษร"
                        minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                        title="รหัสผ่านต้องมีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก และตัวเลข อย่างน้อย 8 ตัวอักษร"
                        autocomplete="new-password" required>
                    <small>ใช้ตัวพิมพ์ใหญ่ พิมพ์เล็ก และตัวเลข</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirm-password" name="confirm-password"
                        placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="8" autocomplete="new-password" required>
                </div>


                <button type="submit" class="btn btn-primary btn-full">
                    ลงทะเบียน
                </button>
            </form>

            <p class="text-center">
                มีบัญชีอยู่แล้ว?
                <a href="login.html">เข้าสู่ระบบ</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>
</body>

</html>
