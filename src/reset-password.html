<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ | CarryHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">CarryHub</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="login.html">เข้าสู่ระบบ</a>
        </nav>
    </header>

    <main class="container">
        <section class="auth-card">
            <h1>ตั้งรหัสผ่านใหม่</h1>
            <p>กรอกรหัสผ่านใหม่ที่ต้องการใช้งาน</p>

            <div class="form-group">
                    <label for="password">รหัสผ่านใหม่</label>
                    <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่านใหม่"
                        minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                        title="รหัสผ่านต้องมีตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก และตัวเลข อย่างน้อย 8 ตัวอักษร"
                        autocomplete="new-password" required>
                    <small>อย่างน้อย 8 ตัวอักษร ใช้ตัวพิมพ์ใหญ่ พิมพ์เล็ก และตัวเลข</small>

                <div class="form-group">
                    <label for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
                    <input type="password" id="confirm-password" placeholder="กรอกรหัสผ่านใหม่อีกครั้ง" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    บันทึกรหัสผ่านใหม่
                </button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 CarryHub</p>
    </footer>
</body>
</html>
